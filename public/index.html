<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>SNKRS Watch</title>
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--border:rgba(255,255,255,0.08);--text:#f0f0f0;--text2:#888;--text3:#555;--accent:#e8ff47;--green:#3ddc84;--orange:#ff9500;--red:#ff453a;--radius:16px;--radius-sm:10px;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
.header{position:sticky;top:0;z-index:100;padding:calc(var(--safe-top) + 12px) 20px 12px;background:rgba(10,10,10,0.85);backdrop-filter:blur(20px);border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:17px}
.status-bar{margin:16px 20px 0;padding:10px 14px;background:var(--surface);border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0}
.pulse.idle{background:var(--text3);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,0.4)}70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.add-section{padding:20px 20px 0}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.8px;color:var(--text3);text-transform:uppercase;margin-bottom:10px}
.add-form{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden}
.add-row{display:flex;align-items:center;padding:0 14px;border-bottom:0.5px solid var(--border)}
.add-row:last-child{border-bottom:none}
.add-row label{font-size:13px;color:var(--text2);width:64px;flex-shrink:0}
.add-row input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;padding:13px 0;font-family:inherit}
.add-row input::placeholder{color:var(--text3)}
.size-chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;flex:1}
.size-chip{padding:5px 10px;border-radius:20px;background:var(--surface2);border:0.5px solid var(--border);font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.15s}
.size-chip.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.add-btn{width:calc(100% - 40px);margin:12px 20px 0;padding:14px;border-radius:var(--radius-sm);background:var(--accent);border:none;cursor:pointer;font-size:15px;font-weight:700;color:#000;transition:opacity 0.15s}
.add-btn:active{opacity:0.8}
.list-section{padding:24px 20px 0}
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.watch-count{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--text2)}
.shoe-list{display:flex;flex-direction:column;gap:10px}
.shoe-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden}
.shoe-card.alert{border-color:var(--accent)}
.shoe-card-header{display:flex;align-items:flex-start;padding:14px 14px 10px;gap:12px}
.shoe-icon{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.shoe-info{flex:1;min-width:0}
.shoe-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.shoe-url{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delete-btn{width:30px;height:30px;border-radius:50%;background:none;border:0.5px solid var(--border);color:var(--text3);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.shoe-sizes{padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:5px}
.size-tag{padding:4px 9px;border-radius:20px;font-size:12px;font-weight:500}
.size-tag.watching{background:rgba(232,255,71,0.12);color:var(--accent);border:0.5px solid rgba(232,255,71,0.25)}
.size-tag.in-stock{background:rgba(61,220,132,0.15);color:var(--green);border:0.5px solid rgba(61,220,132,0.3)}
.size-tag.none{background:var(--surface2);color:var(--text3);border:0.5px solid transparent;text-decoration:line-through}
.shoe-footer{border-top:0.5px solid var(--border);padding:9px 14px;display:flex;align-items:center;justify-content:space-between}
.last-checked{font-size:11px;color:var(--text3)}
.status-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.status-pill.checking{background:rgba(255,149,0,0.15);color:var(--orange)}
.status-pill.in-stock{background:rgba(61,220,132,0.15);color:var(--green)}
.status-pill.sold-out{background:var(--surface2);color:var(--text3)}
.alert-banner{position:fixed;top:0;left:0;right:0;z-index:200;padding:calc(var(--safe-top) + 12px) 20px 16px;background:var(--accent);transform:translateY(-110%);transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1)}
.alert-banner.show{transform:translateY(0)}
.alert-title{font-size:13px;font-weight:700;color:#000;margin-bottom:2px}
.alert-body{font-size:12px;color:rgba(0,0,0,0.65)}
.empty{padding:48px 20px;text-align:center;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px;line-height:1.5}
.bottom-space{height:calc(var(--safe-bottom) + 32px)}
</style>
</head>
<body>
<div class="alert-banner" id="alertBanner">
  <div class="alert-title" id="alertTitle">👟 在庫入荷！</div>
  <div class="alert-body" id="alertBody"></div>
</div>
<div class="header">
  <div class="logo">SNKRS<span>Watch</span></div>
  <div style="display:flex;gap:8px">
    <div class="icon-btn" onclick="manualCheck()">↻</div>
  </div>
</div>
<div class="status-bar">
  <div class="pulse idle" id="pulseEl"></div>
  <div style="flex:1" id="statusText">準備完了</div>
  <div style="font-size:12px;color:var(--text3)" id="nextCheckEl"></div>
</div>
<div class="add-section">
  <div class="section-label">追加</div>
  <div class="add-form">
    <div class="add-row">
      <label>URL</label>
      <input type="url" id="urlInput" placeholder="https://www.nike.com/jp/launch/t/…" />
    </div>
    <div class="add-row">
      <label>名前</label>
      <input type="text" id="nameInput" placeholder="Air Jordan 1 Chicago" />
    </div>
    <div class="add-row" style="align-items:flex-start;padding-top:10px;padding-bottom:10px">
      <label style="padding-top:4px">サイズ</label>
      <div class="size-chips" id="sizeChips"></div>
    </div>
  </div>
  <button class="add-btn" onclick="addShoe()">ウォッチリストに追加</button>
</div>
<div class="list-section">
  <div class="list-header">
    <div class="section-label" style="margin:0">ウォッチリスト</div>
    <div class="watch-count" id="watchCount">0件</div>
  </div>
  <div class="shoe-list" id="shoeList"></div>
</div>
<div class="bottom-space"></div>
<script>
const SIZES=["24","24.5","25","25.5","26","26.5","27","27.5","28","28.5","29","29.5","30"];
let state=JSON.parse(localStorage.getItem("snkrs")||'{"shoes":[]}');
let sel=new Set();
let timer=null,countdown=null,nextAt=null;
const API_BASE=window.location.origin;
function save(){localStorage.setItem("snkrs",JSON.stringify(state))}
function renderChips(){document.getElementById("sizeChips").innerHTML=SIZES.map(s=>`<div class="size-chip${sel.has(s)?" active":""}" onclick="toggleSize('${s}')">${s}</div>`).join("")}
function toggleSize(s){sel.has(s)?sel.delete(s):sel.add(s);renderChips()}
function pickEmoji(n){n=n.toLowerCase();if(n.includes("jordan"))return"🏀";if(n.includes("dunk"))return"🦆";if(n.includes("max"))return"💨";if(n.includes("force"))return"✈️";return"👟"}
function addShoe(){
  const url=document.getElementById("urlInput").value.trim();
  const name=document.getElementById("nameInput").value.trim();
  if(!url||!name)return;
  const shoe={id:Date.now(),url,name,emoji:pickEmoji(name),sizes:[...sel].sort(),stockStatus:{},lastChecked:null,status:"waiting"};
  state.shoes.unshift(shoe);save();renderList();
  document.getElementById("urlInput").value="";
  document.getElementById("nameInput").value="";
  sel.clear();renderChips();checkShoe(shoe.id);
}
function removeShoe(id){state.shoes=state.shoes.filter(s=>s.id!==id);save();renderList()}
function renderList(){
  document.getElementById("watchCount").textContent=state.shoes.length+"件";
  const el=document.getElementById("shoeList");
  if(!state.shoes.length){el.innerHTML='<div class="empty"><div class="empty-icon">👟</div><div class="empty-title">ウォッチリストは空です</div><div class="empty-sub">SNKRSの商品URLとサイズを追加すると<br>在庫入荷時に通知します</div></div>';return}
  el.innerHTML=state.shoes.map(shoe=>{
    const tags=shoe.sizes.length?shoe.sizes.map(sz=>{const st=shoe.stockStatus[sz];const cls=st==="in-stock"?"in-stock":st==="none"?"none":"watching";return`<span class="size-tag ${cls}">${st==="in-stock"?"✓ ":""}${sz}</span>`}).join(""):'<span class="size-tag watching">全サイズ</span>';
    const hasStock=Object.values(shoe.stockStatus).includes("in-stock");
    const pillCls=shoe.status==="checking"?"checking":hasStock?"in-stock":"sold-out";
    const pillText=shoe.status==="checking"?"確認中…":hasStock?"在庫あり":"売り切れ";
    return`<div class="shoe-card${hasStock?" alert":""}" id="card-${shoe.id}"><div class="shoe-card-header"><div class="shoe-icon">${shoe.emoji}</div><div class="shoe-info"><div class="shoe-name">${esc(shoe.name)}</div><div class="shoe-url">${esc(shoe.url)}</div></div><button class="delete-btn" onclick="removeShoe(${shoe.id})">✕</button></div><div class="shoe-sizes">${tags}</div><div class="shoe-footer"><div class="last-checked">${shoe.lastChecked?"最終確認 "+timeAgo(shoe.lastChecked):"まだ確認していません"}</div><div class="status-pill ${pillCls}">${pillText}</div></div></div>`;
  }).join("");
}
async function checkShoe(id){
  const shoe=state.shoes.find(s=>s.id===id);if(!shoe)return;
  shoe.status="checking";renderList();
  try{
    const r=await fetch(`${API_BASE}/api/check?url=${encodeURIComponent(shoe.url)}`);
    const data=await r.json();
    const prev={...shoe.stockStatus};
    data.sizes.forEach(s=>{shoe.stockStatus[s.label]=s.available?"in-stock":"none"});
    shoe.lastChecked=Date.now();shoe.status="done";
    const newIn=shoe.sizes.filter(sz=>shoe.stockStatus[sz]==="in-stock"&&prev[sz]!=="in-stock");
    if(newIn.length)notifyUser(shoe,newIn);
  }catch(e){shoe.status="done";shoe.lastChecked=Date.now()}
  save();renderList();
}
async function checkAll(){
  if(!state.shoes.length)return;
  setBar(true,"チェック中…");
  for(const s of state.shoes){await checkShoe(s.id);await sleep(1200)}
  setBar(false,`完了 — ${state.shoes.length}件確認`);
}
function manualCheck(){clearTimeout(timer);checkAll().then(scheduleNext)}
function scheduleNext(){
  clearTimeout(timer);clearInterval(countdown);
  nextAt=Date.now()+600000;
  timer=setTimeout(()=>checkAll().then(scheduleNext),600000);
  countdown=setInterval(()=>{const m=Math.ceil(Math.max(0,nextAt-Date.now())/60000);document.getElementById("nextCheckEl").textContent=m>0?`次回 ${m}分後`:""},15000);
  document.getElementById("nextCheckEl").textContent="次回 10分後";
}
function notifyUser(shoe,sizes){
  const msg=`${shoe.name} — ${sizes.join(", ")} が入荷！`;
  document.getElementById("alertTitle").textContent="👟 在庫入荷！";
  document.getElementById("alertBody").textContent=msg;
  const b=document.getElementById("alertBanner");b.classList.add("show");setTimeout(()=>b.classList.remove("show"),4000);
  if(Notification.permission==="granted")new Notification("👟 SNKRS 在庫入荷",{body:msg});
}
function setBar(active,text){document.getElementById("pulseEl").className="pulse"+(active?"":" idle");document.getElementById("statusText").textContent=text}
function timeAgo(ts){const d=Date.now()-ts;if(d<60000)return"今";if(d<3600000)return Math.floor(d/60000)+"分前";return Math.floor(d/3600000)+"時間前"}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
renderChips();renderList();scheduleNext();
</script>
</body>
</html>
